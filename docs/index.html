  <style>
    /* ==========================================================================
       UNCLUTTERED TECHNICAL DESIGN SYSTEM (Linear / Stripe / Tailwind Standard)
       ========================================================================== */
    :root {
      --bg-base: #080c14;
      --bg-subtle: #0d121f;
      --bg-surface: #121826;
      --bg-card: #151d2e;
      --bg-hover: #1c253b;
      --bg-active: #232e48;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.12);
      --border-focus: rgba(56, 189, 248, 0.45);
      
      --text-1: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --text-4: #64748b;
      
      --cyan: #38bdf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #a855f7;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background-color: var(--bg-base);
      color: var(--text-2);
      font-family: var(--font-sans);
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Top Bar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-1); font-weight: 700; font-size: 0.95rem; }
    .brand-logo svg { width: 20px; height: 20px; color: var(--cyan); }
    .brand-badge {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
    }
    .header-center { flex: 1; max-width: 480px; margin: 0 24px; }
    .search-btn {
      width: 100%;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-4);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .search-btn:hover { border-color: var(--border-medium); color: var(--text-3); }
    .search-kbd {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.68rem;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-gh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-3);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s;
    }
    .header-gh-btn:hover { background: var(--bg-hover); color: #fff; border-color: var(--border-medium); }

    /* App Layout */
    .app-body {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 240px;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 56px);
    }
    @media (max-width: 1280px) {
      .app-body { grid-template-columns: 270px minmax(0, 1fr); }
      .app-toc { display: none; }
    }
    @media (max-width: 860px) {

    }

    /* Left Navigation Accordion */
    .app-nav {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border-subtle);
      padding: 20px 14px 40px;
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
      overflow-y: auto;

    .sidebar-search-wrap {
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .sidebar-search-input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      color: var(--text-2);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .sidebar-search-input:focus { border-color: var(--cyan); }

    .nav-group {
      margin-bottom: 12px;
    }
    .nav-group-header {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-3);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: color 0.15s, background 0.15s;
    }
    .nav-group-header:hover { color: var(--text-1); background: rgba(255,255,255,0.02); }
    .nav-group-header-left { display: flex; align-items: center; gap: 8px; }
    .nav-group-chevron { font-size: 9px; transition: transform 0.2s ease; display: inline-block; color: var(--text-4); }
    .nav-group.collapsed .nav-group-chevron { transform: rotate(-90deg); }
    .nav-group-count {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-4);
      background: rgba(255, 255, 255, 0.04);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
      padding-left: 10px;
      border-left: 1px solid rgba(255,255,255,0.04);
      margin-left: 12px;

    .nav-group.collapsed .nav-list { display: none; }
    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--text-3);
      font-size: 0.83rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      line-height: 1.4;
      text-decoration: none;
    }
    .nav-item-btn:hover { color: var(--text-1); background: var(--bg-hover); }
    .nav-item-btn.active { color: #fff; background: var(--bg-active); font-weight: 600; border-left: 2px solid var(--cyan); border-radius: 0 6px 6px 0; }
    .nav-item-num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--cyan); margin-right: 6px; }

    /* Center Main Content */
    .app-main {
      padding: 40px 52px 100px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 700px) {
      .app-main { padding: 24px 18px 80px; }
    }

    .content-header { margin-bottom: 28px; }
    .doc-cat {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--cyan);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .doc-heading {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-1);
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .doc-intro {
      font-size: 1.05rem;
      color: var(--text-3);
      line-height: 1.6;
    }

    /* Page Tabs Bar (Clean Segmented Architecture) */
    .page-tabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border-medium);
      margin-bottom: 28px;
      overflow-x: auto;
      padding-bottom: 1px;
    }
    .page-tab-btn {
      background: none;
      border: none;
      color: var(--text-3);
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .page-tab-btn:hover { color: var(--text-1); }
    .page-tab-btn.active {
      color: var(--cyan);
    }
    .page-tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--cyan);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Clean Card Layouts */
    .clean-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 22px 24px;
      margin-bottom: 18px;
      transition: border-color 0.15s ease;
    }
    .clean-card:hover { border-color: var(--border-medium); }
    .clean-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .clean-card-body {
      font-size: 0.92rem;
      color: var(--text-2);
      line-height: 1.68;
    }

    .doc-block { margin-bottom: 32px; }
    .doc-subheading {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.015em;
      margin-bottom: 12px;
    }
    .doc-paragraph {
      font-size: 0.94rem;
      color: var(--text-2);
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .doc-p { margin-bottom: 10px; line-height: 1.68; }
    .doc-list { margin-left: 20px; margin-bottom: 12px; line-height: 1.7; }
    .doc-list li { margin-bottom: 5px; }
    .inline-code {

      font-size: 0.83rem;

      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* Stance Callouts */
    .stance-box {
      background: rgba(56, 189, 248, 0.04);
      border-left: 3px solid var(--cyan);
      border-radius: 0 8px 8px 0;
      padding: 18px 22px;
      margin: 16px 0 24px;
    }
    .stance-box.alert-veto { background: rgba(244, 63, 94, 0.04); border-left-color: var(--rose); }
    .stance-box.alert-ship { background: rgba(168, 85, 247, 0.04); border-left-color: var(--purple); }
    .stance-header { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; color: var(--text-1); }
    .stance-text { font-size: 0.94rem; line-height: 1.65; color: var(--text-1); font-style: italic; }

    /* 2-Column Responsive Routing */
    .routing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0 24px; }
    @media (max-width: 760px) { .routing-grid { grid-template-columns: 1fr; } }
    .routing-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 18px; }
    .routing-card-header { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .routing-card-use .routing-card-header { color: var(--emerald); }
    .routing-card-avoid .routing-card-header { color: var(--rose); }
    .routing-items-list { list-style: none; display: flex; flex-direction: column; gap: 9px; font-size: 0.86rem; color: var(--text-2); }
    .routing-item { display: flex; align-items: flex-start; gap: 8px; line-height: 1.5; }

    /* Step Cards */
    .step-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 20px 22px;
      margin-bottom: 14px;
    }
    .step-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .step-card-title { font-size: 0.95rem; font-weight: 700; color: var(--text-1); }
    .step-tiers-group { display: flex; gap: 5px; }

    /* Tier Pills */
    .tier-pill {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }
    .tier-pill-mvp { background: rgba(16, 185, 129, 0.12); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.25); }
    .tier-pill-prod { background: rgba(56, 189, 248, 0.12); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.25); }
    .tier-pill-scale { background: rgba(168, 85, 247, 0.12); color: var(--purple); border: 1px solid rgba(168, 85, 247, 0.25); }
    .tier-pill-all { background: rgba(245, 158, 11, 0.12); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.25); }

    /* Code Snippets */
    .code-snippet-box {
      background: #090e17;
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      overflow: hidden;
      margin: 12px 0 18px;
    }
    .snippet-top {
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-subtle);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-4);
    }
    .snippet-copy-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-3);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .snippet-copy-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .code-snippet-box pre {
      padding: 14px 18px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #e2e8f0;
      overflow-x: auto;
      line-height: 1.6;
    }

    /* Interactive Checklists */
    .checklist-progress-wrap { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 18px 22px; margin-bottom: 22px; }
    .checklist-progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.88rem; }
    .checklist-progress-bar { width: 100%; height: 7px; background: rgba(255, 255, 255, 0.06); border-radius: 4px; overflow: hidden; }
    .checklist-progress-fill { height: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); transition: width 0.3s ease; }
    .checklist-cat-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 18px 22px; margin-bottom: 16px; }
    .checklist-cat-header { font-size: 0.92rem; font-weight: 700; color: var(--text-1); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .checklist-item-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
    .checklist-item-row:last-child { border-bottom: none; }
    .check-custom { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--text-4); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; transition: all 0.15s ease; cursor: pointer; }
    .check-custom.checked { background: #10b981; border-color: #10b981; color: #000; font-weight: 700; font-size: 11px; }
    .checklist-item-text { font-size: 0.9rem; color: var(--text-2); line-height: 1.5; }
    .checklist-item-text.done { text-decoration: line-through; opacity: 0.6; }

    /* Interactive ADR Builder & Forms */
    .adr-form-group { margin-bottom: 16px; }
    .adr-label { display: block; font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); margin-bottom: 6px; }
    .adr-input, .adr-textarea, .adr-select { width: 100%; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 9px 12px; color: var(--text-1); font-family: inherit; font-size: 0.88rem; outline: none; transition: border-color 0.15s; }
    .adr-input:focus, .adr-textarea:focus, .adr-select:focus { border-color: var(--cyan); }
    .adr-textarea { min-height: 80px; resize: vertical; line-height: 1.5; }

    /* Benchmark Scorecards & Matrix */
    .eval-score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 16px 0 24px; }
    .eval-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 18px; }
    .eval-card-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-4); margin-bottom: 6px; }
    .eval-card-val { font-size: 1.6rem; font-weight: 800; font-family: var(--font-mono); color: var(--cyan); }
    .eval-card-sub { font-size: 0.78rem; color: var(--text-3); margin-top: 4px; }

    /* Route Tables */
    .spec-table-box { width: 100%; overflow-x: auto; margin: 14px 0; border: 1px solid var(--border-subtle); border-radius: 7px; }
    .spec-table-box table { width: 100%; border-collapse: collapse; font-size: 0.86rem; text-align: left; }
    .spec-table-box th { background: rgba(255,255,255,0.02); padding: 9px 14px; color: var(--text-3); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-subtle); }
    .spec-table-box td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: top; }
    .badge-method { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .method-get { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .method-post { background: rgba(16, 185, 129, 0.15); color: #10b981; }

    /* Right TOC */
    .app-toc {
      padding: 24px 18px 40px;
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
      overflow-y: auto;
    }
    .toc-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-4);
      margin-bottom: 12px;
    }
    .toc-links { list-style: none; display: flex; flex-direction: column; gap: 7px; border-left: 1px solid var(--border-subtle); padding-left: 10px; }
    .toc-a { color: var(--text-4); font-size: 0.8rem; text-decoration: none; transition: color 0.15s; line-height: 1.4; display: block; }
    .toc-a:hover { color: var(--text-2); }
    .toc-a.active { color: var(--cyan); font-weight: 600; }

    /* Action Buttons */
    .hud-action-btn {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .hud-action-btn:hover { background: rgba(56, 189, 248, 0.18); border-color: var(--cyan); }

    /* Command Palette */
    .palette-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 1000; align-items: flex-start; justify-content: center; padding-top: 120px; }
    .palette-window { background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: 10px; width: 100%; max-width: 580px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); overflow: hidden; }
    .palette-search-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }

      "--"

    "rules": [
      {
        "title": "Rigor Tier Rule:",
        "text": "- *If* the app touches public accounts, user email, payments, or sensitive data, *choose* **PROD** tier *because* security and data integrity failures have legal and financial consequences. - *If* the app exceeds 100k MAU, processes high transaction volume, or requires strict SLAs, *choose* **SCALE** tier *because* concurrency and failure cascades require distributed isolation. - *Otherwise*, *choose* **MVP** tier *because* speed to validation takes priority for internal prototypes."

        "title": "Context Budget Rule:",
        "text": "- *If* routing specialists, *choose* at most 2 to 5 specialists per phase *because* loading excessive skills wastes tokens and degrades agent focus."

      {
        "title": "Conflict Resolution Rule:",

    "steps": [

        "title": "Step 1: Intake & Rigor Tier Classification [MVP] [PROD] [SCALE]",

    "refuse": "I refuse to permit building features without an identified user problem, unprioritized kitchen-sink scope lists, vague success metrics, or launching initiatives without predefined kill criteria. Every feature must earn its development cost.",

      "**Kill Criteria & Metrics:** What measurable metric determines whether this feature succeeded or failed within 30 days of launch, and at what threshold do we pull the plug?"
    ],
    "whenToUse": [

      "Authoring a formal Product Requirements Document (`prd.schema.json`).",
      "Pruning an over-scoped backlog into a tight, testable MVP.",
      "Defining user personas, user stories, and acceptance criteria.",
      "Setting up customer feedback loops and quantitative success metrics."

    "whenNotToUse": [
      "Choosing database schemas or API protocols (route to `02-architecture`).",
      "Auditing software for security vulnerabilities (route to `06-security`).",
      "Writing code or unit test suites (route to `04-frontend` / `05-backend-data`).",

    "rules": [
      {
        "title": "MoSCoW Scoping Rule:",
        "text": "- *If* a feature does not directly enable the primary Job-to-be-Done or block launch compliance, *relegate it* to **Should Have** or **Could Have** *because* shipping late with bloat destroys feedback cycles [BEST PRACTICE: SHAPE-UP]. - *Limit* Must-Haves to at most 3 to 5 core capabilities for any single release cycle."
      },
      {
        "title": "Acceptance Criteria Precision Rule:",
        "text": "- *Never* write subjective criteria like \"The UI should look clean and fast\"; *mandate* testable statements in Given-When-Then format (e.g. \"Given an unauthenticated user, when they click Checkout, then they are redirected to /login with return_to param\") *because* ambiguity in PRDs creates downstream implementation drift [BEST PRACTICE: LEAN-STARTUP]."
      },
      {
        "title": "Kill Criteria Rule:",
        "text": "- *Every* feature PRD must specify an explicit condition for decommissioning (e.g. \"If fewer than 5% of active users use this feature after 60 days, deprecate and remove the code\") *because* dead code creates permanent maintenance drag. ---"
      }
    ],
    "steps": [
      {
        "title": "Step 1: JTBD Problem Extraction [MVP] [PROD] [SCALE]",
        "body": "1. Frame the user problem:\n   - \"When [situation], I want to [motivation], so I can [expected outcome].\"\n2. Identify existing manual workarounds (spreadsheets, manual emails, copy-pasting).\n3. Validate that the proposed feature offers at least a 10x improvement in speed, cost, or convenience over the workaround."

        "title": "Step 2: MoSCoW Categorization & Scope Cut [MVP] [PROD] [SCALE]",

        "title": "Step 3: Acceptance Criteria & User Stories [MVP] [PROD] [SCALE]",

    "markdown": "# Production Operations Runbook\n\n> **Schema Conformance:** `templates/schemas/runbook.schema.json`  \n> **Author:** `09-devops-infra`  \n> **Authority Status:** APPROVED | REJECTED\n\n---\n\n## 1. Service Overview\n- **Service Name:** [Service Name]\n- **Environment:** [staging | production]\n- **Target Tier:** [MVP | PROD | SCALE]\n- **On-Call Lead:** [Name / Slack handle]\n\n## 2. Standard Deployment Procedure\n| Step | Action / Command | Expected Output | Timeout |\n|---|---|---|---|\n| 1 | `git checkout main && git pull` | Clean working tree | 30s |\n| 2 | `pnpm run db:migrate` | Migrations applied with `SET lock_timeout = '2s'` | 60s |\n| 3 | `docker compose up -d --build` | Container started | 120s |\n| 4 | `curl -f http://localhost:3000/api/health/readiness` | HTTP 200 `{\"status\":\"ready\"}` | 10s |\n\n## 3. Automated Health Checks\n- **Liveness Endpoint:** `/api/health/liveness` (Target: HTTP 200, timeout 3s)\n- **Readiness Endpoint:** `/api/health/readiness` (Target: HTTP 200, checks DB and Cache)\n\n## 4. Automated Rollback Procedure\n- **Trigger Conditions:** `/api/health/readiness` returns non-200 for 3 consecutive intervals OR error rate > 1.0%.\n- **Rollback Command:** `./scripts/rollback.sh [previous_image_sha]`\n- **Maximum Allowed Downtime:** < 60 seconds.\n- **Rollback Verified in Staging:** Yes / No\n\n## 5. Metric Thresholds & Alert Actions\n| Metric | Threshold | Action |\n|---|---|---|\n| HTTP 5xx Error Rate | > 1.0% over 5 min | PagerDuty alert to on-call engineer |\n| Database CPU | > 80% over 10 min | Inspect `pg_stat_statements` for runaway queries |\n| Worker Queue Depth | > 500 unprocessed jobs | Horizontally scale worker container instances |\n\n",
    "schemaFile": "runbook.schema.json",
    "hasSchema": true,
    "schema": {
      "$schema": "http://json-schema.org/draft-07/schema#",

    // Helper: Formats plain markdown with bold, italic, code, and bullet lists
    function formatProse(text) {
      if (!text) return '';
      let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^\*]+)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

      const lines = escaped.split(/\r?\n/);
      let out = [];
      let inList = false;

      for (let l of lines) {
        const trimmed = l.trim();
        if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          if (!inList) { out.push('<ul class="doc-list">'); inList = true; }
          out.push(`<li>${trimmed.slice(2)}</li>`);
        } else {
          if (inList) { out.push('</ul>'); inList = false; }
          if (trimmed.length > 0) {
            out.push(`<p class="doc-p">${trimmed}</p>`);
          }
        }
      }
      if (inList) out.push('</ul>');
      return out.join('\n');
    }

    function filterSidebar(query) {
      const q = query.toLowerCase().trim();
      const items = document.querySelectorAll('.app-nav .nav-list li');
      const groups = document.querySelectorAll('.app-nav .nav-group');

      if (!q) {
        items.forEach(i => i.style.display = '');
        return;
      }

      groups.forEach(g => g.classList.remove('collapsed'));
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(q) ? '' : 'none';
      });
    }

      currentDocTab = tabName;

    function loadContent(key, btnElement = null) {
      if (btnElement) {
        document.querySelectorAll('.nav-item-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
      }

      const main = document.getElementById('content');
      const toc = document.getElementById('tocLinksContainer');

      // Expand parent accordion if collapsed
      if (key.startsWith('spec-')) {
        document.getElementById('grp-specialists')?.classList.remove('collapsed');
        const spec = SPECIALISTS.find(s => s.id === key.replace('spec-', ''));
        if (spec) renderSpecialistPage(spec, main, toc);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (key.startsWith('pb-')) {
        document.getElementById('grp-playbooks')?.classList.remove('collapsed');
        const pb = PLAYBOOKS.find(p => p.slug === key.replace('pb-', ''));
        if (pb) renderPlaybookPage(pb, main, toc);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (key.startsWith('checklist-')) {
        document.getElementById('grp-checklists')?.classList.remove('collapsed');
        const cl = CHECKLISTS.find(c => c.id === key.replace('checklist-', ''));
        if (cl) renderChecklistPage(cl, main, toc);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (key.startsWith('template-')) {
        document.getElementById('grp-templates')?.classList.remove('collapsed');
        const tmpl = TEMPLATES.find(t => t.id === key.replace('template-', ''));
        if (tmpl) renderTemplatePage(tmpl, main, toc);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      switch (key) {
        case 'adr-builder':
          document.getElementById('grp-templates')?.classList.remove('collapsed');
          renderAdrBuilderPage(main, toc);
          break;
        case 'benchmarks':
          renderBenchmarksPage(main, toc);
          break;
        case 'quickstart':
          renderQuickstartPage(main, toc);
          break;
        case 'tiers':
          renderTiersPage(main, toc);
          break;
        case 'protocol':
          renderProtocolPage(main, toc);
          break;
        case 'vetos':
          renderVetosPage(main, toc);
          break;
        case 'hygiene':
          renderHygienePage(main, toc);
          break;
        case 'refprojects':
          renderRefProjectsPage(main, toc);
          break;
        case 'adapters':
          renderAdaptersPage(main, toc);
          break;
        case 'overview':
        default:
          renderOverviewPage(main, toc);
          break;
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // View: Interactive Checklists
    function renderChecklistPage(cl, main, toc) {
      const storageKey = 'webdev_checklist_' + cl.id;
      let state = {};
      try { state = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) {}

      let checkedCount = 0;
      let totalCount = 0;
      cl.categories.forEach((cat, cIdx) => {
        cat.items.forEach((item, iIdx) => {
          totalCount++;
          if (state[`c${cIdx}_i${iIdx}`]) checkedCount++;
        });
      });

      const pct = totalCount > 0 ? Math.round((checkedCount / totalCount) * 100) : 0;

      toc.innerHTML = `
        <li><a href="#summary" class="toc-a active">Audit Summary</a></li>
        ${cl.categories.map((c, idx) => `<li><a href="#cat-${idx}" class="toc-a">${c.title}</a></li>`).join('')}

      main.innerHTML = `
        <div class="content-header">
          <div class="doc-cat">Interactive Verification Checklist</div>
          <h1 class="doc-heading" id="summary">${cl.title}</h1>
          <p class="doc-intro">Authority Gate: <strong style="color: var(--cyan);">${cl.authority}</strong></p>
        </div>

        <div class="checklist-progress-wrap">
          <div class="checklist-progress-top">
            <span style="font-weight: 600; color: var(--text-1);">Audit Readiness Progress</span>
            <span style="font-family: var(--font-mono); font-weight: 700; color: ${pct === 100 ? '#10b981' : 'var(--cyan)'}">${checkedCount} / ${totalCount} Passed (${pct}%)</span>
          </div>
          <div class="checklist-progress-bar">
            <div class="checklist-progress-fill" style="width: ${pct}%;"></div>
          </div>
          <div style="display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;">
            <button class="hud-action-btn" onclick="runChecklistMission('${cl.id}')">⚡ Verify in DevBot HUD</button>
            <button class="snippet-copy-btn" onclick="exportChecklistReport('${cl.id}')">Export JSON Report</button>
            <button class="snippet-copy-btn" onclick="resetChecklist('${cl.id}')">Reset Checks</button>
          </div>
        </div>

        ${cl.categories.map((cat, cIdx) => `
          <div class="checklist-cat-card" id="cat-${cIdx}">
            <div class="checklist-cat-header">
              <span>${cat.title}</span>
              <span class="tier-pill tier-pill-mvp">${cat.items.length} items</span>
            </div>
            <div style="display: flex; flex-direction: column;">
              ${cat.items.map((item, iIdx) => {
                const key = `c${cIdx}_i${iIdx}`;
                const isChecked = !!state[key];
                return `
                  <div class="checklist-item-row" onclick="toggleChecklistItem('${cl.id}', ${cIdx}, ${iIdx})">
                    <div class="check-custom ${isChecked ? 'checked' : ''}">${isChecked ? '✓' : ''}</div>
                    <div class="checklist-item-text ${isChecked ? 'done' : ''}">${item}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `).join('')}
      `;
    }

    function toggleChecklistItem(clId, cIdx, iIdx) {
      const storageKey = 'webdev_checklist_' + clId;
      let state = {};
      try { state = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) {}
      const key = `c${cIdx}_i${iIdx}`;
      state[key] = !state[key];
      localStorage.setItem(storageKey, JSON.stringify(state));
      const cl = CHECKLISTS.find(c => c.id === clId);
      if (cl) renderChecklistPage(cl, document.getElementById('content'), document.getElementById('tocLinksContainer'));
    }

    function resetChecklist(clId) {
      localStorage.removeItem('webdev_checklist_' + clId);
      const cl = CHECKLISTS.find(c => c.id === clId);
      if (cl) renderChecklistPage(cl, document.getElementById('content'), document.getElementById('tocLinksContainer'));
    }

    function exportChecklistReport(clId) {
      const cl = CHECKLISTS.find(c => c.id === clId);
      if (!cl) return;
      const storageKey = 'webdev_checklist_' + clId;
      let state = {};
      try { state = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) {}

      const report = {
        checklist: cl.title,
        authority: cl.authority,
        timestamp: new Date().toISOString(),
        totalItems: cl.totalItems,
        results: cl.categories.map((cat, cIdx) => ({
          category: cat.title,
          items: cat.items.map((item, iIdx) => ({
            requirement: item,
            verified: !!state[`c${cIdx}_i${iIdx}`]
          }))
        }))
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(report, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${clId}-audit-report.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

${context}

      downloadAnchor.setAttribute("download", "adr.json");

    function openPalette() {
      const backdrop = document.getElementById('paletteBackdrop');
      backdrop.classList.add('open');
      const input = document.getElementById('paletteInput');
      input.value = '';
      input.focus();
      filterPalette();
    }

    function closePalette() {
      document.getElementById('paletteBackdrop').classList.remove('open');
    }

    function closePaletteOnBackdrop(e) {
      if (e.target.id === 'paletteBackdrop') closePalette();
    }

    function filterPalette() {
      const q = document.getElementById('paletteInput')?.value?.toLowerCase().trim() || '';
      const list = document.getElementById('paletteResults');
      if (!list) return;

      let items = [];

      // Add Specialists
      SPECIALISTS.forEach(s => {
        items.push({
          type: 'Specialist',
          title: s.name,
          badge: s.auth,
          key: 'spec-' + s.id,
          text: s.name + ' ' + s.triggers.join(' ') + ' ' + s.id
        });
      });

      // Add Playbooks
      PLAYBOOKS.forEach(p => {
        items.push({
          type: 'Playbook',
          title: p.title,
          badge: p.tier,
          key: 'pb-' + p.slug,
          text: p.title + ' ' + p.slug + ' ' + p.objective
        });
      });

      // Add Checklists
      CHECKLISTS.forEach(c => {
        items.push({
          type: 'Checklist',
          title: c.title,
          badge: c.totalItems + ' items',
          key: 'checklist-' + c.id,
          text: c.title + ' ' + c.id
        });
      });

      // Add Templates
      TEMPLATES.forEach(t => {
        items.push({
          type: 'Template',
          title: t.title,
          badge: 'Schema',
          key: 'template-' + t.id,
          text: t.title + ' ' + t.id
        });
      });

      items.push({ type: 'Tool', title: 'Interactive ADR Builder', badge: 'Utility', key: 'adr-builder', text: 'adr builder form architecture' });
      items.push({ type: 'Eval', title: 'Empirical Benchmark Dashboard', badge: '+79.9% Delta', key: 'benchmarks', text: 'evals benchmark rubric results' });
      items.push({ type: 'Reference', title: '3 Golden Reference Projects', badge: '21 Tests', key: 'refprojects', text: 'reference projects mvp prod scale saas ecommerce' });

      const filtered = q ? items.filter(i => i.text.toLowerCase().includes(q)) : items.slice(0, 12);

      list.innerHTML = filtered.map(item => `
        <li>
          <div class="palette-result-item" onclick="loadContent('${item.key}'); closePalette();">
            <span class="palette-res-type">${item.type}</span>
            <span class="palette-res-title">${item.title}</span>
            <span class="palette-res-tier">${item.badge}</span>
          </div>
        </li>
      `).join('');
    }

    function toggleAgentDrawer() {
      agentDrawerOpen = !agentDrawerOpen;
      const drawer = document.getElementById('agentDrawer');
      const capsule = document.querySelector('.agent-trigger-capsule');
      if (agentDrawerOpen) {
        drawer.classList.add('open');
        capsule.setAttribute('aria-expanded', 'true');
      } else {
        drawer.classList.remove('open');
        capsule.setAttribute('aria-expanded', 'false');
      }
    }

    function setAgentState(visorColor, leadStatus, taskName) {
      document.getElementById('hudVisor').setAttribute('fill', visorColor);
      document.getElementById('hudLeadStatus').innerText = leadStatus;
      document.getElementById('hudTaskName').innerText = taskName;
    }

    function addTerminalLog(roleClass, roleLabel, msg) {
      const term = document.getElementById('drawerTerminal');
      const time = new Date().toTimeString().split(' ')[0];
      const div = document.createElement('div');
      div.className = 'term-line';
      div.innerHTML = `<span class="term-time">${time}</span><span class="term-badge ${roleClass}">[${roleLabel}]</span><span>${msg}</span>`;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    }

    function runSpecialistMission(specId) {
      if (!agentDrawerOpen) toggleAgentDrawer();
      const spec = SPECIALISTS.find(s => s.id === specId);
      if (!spec) return;

      let color = '#00f0ff';
      let roleClass = 'badge-color-orch';
      if (spec.authType === 'veto') { color = '#f43f5e'; roleClass = 'badge-color-sec'; }
      else if (spec.authType === 'ship') { color = '#a855f7'; roleClass = 'badge-color-qa'; }

      setAgentState(color, spec.name, 'Running Verification...');
      addTerminalLog(roleClass, spec.id, 'Executing verification check for ' + spec.name + '...');

      setTimeout(() => {
        addTerminalLog(roleClass, spec.id, '>>> Checking inputs: ' + spec.inputs.join(', '));
        addTerminalLog(roleClass, spec.id, '>>> Checking invariants & ' + spec.antiPatterns.length + ' anti-patterns...');
        setTimeout(() => {
          addTerminalLog('badge-color-qa', spec.id, 'PASS: Verification check passed with 0 critical findings. Ready for handoff.');
          setAgentState('#10b981', 'Agent Idle', spec.name + ' VERIFIED');
        }, 800);
      }, 700);
    }

    function copyText(text, btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          const orig = btn.innerText;
          btn.innerText = 'Copied!';
          setTimeout(() => { btn.innerText = orig; }, 1800);
        });
      }
    }
