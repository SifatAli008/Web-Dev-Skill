  <style>
    /* ==========================================================================
       USER-FRIENDLY DEVELOPER DOCUMENTATION THEME (Tailwind / Next.js / Stripe Style)
       ========================================================================== */
    :root {
      /* Clear, layered slate dark theme */
      --bg-base: #0b0f17;
      --bg-subtle: #0f1523;
      --bg-surface: #141b2d;
      --bg-card: #182238;
      --bg-card-hover: #1e2b46;
      --bg-code: #080c14;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(56, 189, 248, 0.5);
      
      /* High-contrast crisp typography */
      --text-1: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --text-4: #64748b;
      
      /* Vibrant semantics */
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.15);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #818cf8;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background-color: var(--bg-base);
      color: var(--text-2);
      font-family: var(--font-sans);
      line-height: 1.75;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient Soft Top Glow */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 15%;
      right: 15%;
      height: 280px;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(56, 189, 248, 0.08), transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    /* Accessible Skip Link */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--cyan);
      color: #040810;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 6px;
      z-index: 1000;
      text-decoration: none;
      transition: top 0.15s ease;
    }
    .skip-link:focus { top: 10px; }

    /* Top Bar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 23, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-1);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      transition: color 0.15s ease;
    }
    .brand-link:hover { color: #fff; }
    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      flex-shrink: 0;
    }
    .version-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-3);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: 12px;
      line-height: 1;
    }
    .header-center { flex: 1; max-width: 480px; margin: 0 24px; }
    .palette-trigger {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-3);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .palette-trigger:hover {
      border-color: var(--border-medium);
      color: var(--text-2);
      background: var(--bg-card);
    }
    .palette-trigger-left { display: flex; align-items: center; gap: 8px; }
    .palette-trigger kbd {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      color: var(--text-3);
      white-space: nowrap;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-nav-link {
      color: var(--text-3);
      text-decoration: none;
      font-size: 0.83rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .header-nav-link:hover { color: var(--text-1); }
    .header-gh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
    }
    .header-gh-btn:hover { background: var(--bg-card); color: #fff; border-color: var(--border-medium); }

    /* App Layout */
    .app-body {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 240px;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 58px);
      position: relative;
      z-index: 1;
    }
    @media (max-width: 1280px) {
      .app-body { grid-template-columns: 280px minmax(0, 1fr); }
      .app-toc { display: none; }
    }
    @media (max-width: 860px) {
      .app-body { grid-template-columns: 1fr; }
      .app-nav { display: none; }
    }

    /* Left Navigation Sidebar */
    .app-nav {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border-subtle);
      padding: 18px 12px 40px;
      height: calc(100vh - 58px);
      position: sticky;
      top: 58px;
      overflow-y: auto;
    }
    .sidebar-search-wrap { margin-bottom: 14px; padding: 0 4px; }
    .sidebar-search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-1);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .sidebar-search-input:focus { border-color: var(--cyan); }

    .nav-group { margin-bottom: 8px; }
    .nav-group-header {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      color: var(--text-3);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .nav-group-header:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.04); }
    .nav-group-header-left { display: flex; align-items: center; gap: 7px; }
    .nav-chevron { color: var(--text-4); transition: transform 0.2s ease; flex-shrink: 0; }
    .nav-group.collapsed .nav-chevron { transform: rotate(-90deg); }
    .nav-group-count {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-4);
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 3px;
      padding-left: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: 12px;
    }
    .nav-group.collapsed .nav-list { display: none; }
    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--text-3);
      font-size: 0.83rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      transition: all 0.15s ease;
      line-height: 1.4;
      text-decoration: none;
      font-family: inherit;
    }
    .nav-item-btn:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.05); }
    .nav-item-btn.active {
      color: #fff;
      background: var(--bg-card);
      font-weight: 600;
      border-left: 2px solid var(--cyan);
      border-radius: 0 6px 6px 0;
    }
    .nav-item-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 1px 5px;
      border-radius: 4px;
      min-width: 24px;
      text-align: center;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Center Main Content */
    .app-main {
      padding: 40px 52px 100px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 700px) {
      .app-main { padding: 24px 18px 80px; }
    }

    /* Content Typography & Header */
    .content-header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 20px;
    }
    .doc-cat {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--cyan);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .doc-heading {
      font-size: 1.95rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .doc-intro {
      font-size: 1.05rem;
      color: var(--text-3);
      line-height: 1.65;
      max-width: 740px;
    }
    .doc-block { margin-bottom: 38px; }
    .doc-subheading {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: -0.01em;
      margin: 32px 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }
    .doc-paragraph {
      margin-bottom: 14px;
      color: var(--text-2);
      font-size: 0.95rem;
      line-height: 1.75;
    }
    .doc-list {
      margin: 0 0 16px 20px;
      color: var(--text-2);
      font-size: 0.95rem;
      line-height: 1.75;
    }
    .doc-list li { margin-bottom: 6px; }
    .inline-code {
      font-family: var(--font-mono);
      font-size: 0.84em;
      background: rgba(255, 255, 255, 0.07);
      color: var(--cyan);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Quick Install Hero Box */
    .quick-install-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      padding: 12px 18px;
      margin: 20px 0 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    .quick-install-command {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: #fff;
    }
    .prompt-symbol { color: var(--cyan); font-weight: 700; user-select: none; }

    /* Segmented Tab Bar */
    .page-tabs-bar {
      display: flex;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
      overflow-x: auto;
    }
    .page-tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      color: var(--text-3);
      font-size: 0.83rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .page-tab-btn:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.04); }
    .page-tab-btn.active {
      color: #fff;
      background: var(--bg-card);
      font-weight: 600;
      border: 1px solid var(--border-medium);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards & Elevated Containers */
    .clean-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 14px;
      transition: all 0.15s ease;
    }
    .callout-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 14px 18px;
      margin: 18px 0;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .callout-box.alert-veto { border-left-color: var(--rose); background: rgba(244, 63, 94, 0.06); }
    .callout-box.alert-ship { border-left-color: var(--purple); background: rgba(129, 140, 248, 0.06); }
    .callout-box.alert-gate { border-left-color: var(--cyan); }

    /* Tables */
    .spec-table-box {
      overflow-x: auto;
      margin: 18px 0 24px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: var(--bg-surface);
    }
    .spec-table-box table { width: 100%; border-collapse: collapse; font-size: 0.86rem; text-align: left; }
    .spec-table-box th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-3);
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .spec-table-box td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-2);
      vertical-align: top;
    }
    .spec-table-box tr:last-child td { border-bottom: none; }

    /* Code Snippets */
    .code-snippet-box {
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin: 14px 0 20px;
      overflow: hidden;
    }
    .snippet-top {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      font-family: var(--font-mono);
      color: var(--text-3);
    }
    .snippet-copy-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-2);
      font-size: 0.74rem;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .snippet-copy-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); border-color: var(--border-medium); }
    .code-snippet-box pre {
      padding: 16px 18px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.65;
      color: var(--text-2);
    }

    /* Action button */
    .hud-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--cyan);
      font-weight: 600;
      font-size: 0.83rem;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .hud-action-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--cyan);
      color: #fff;
    }

    /* Sequential Pagination Footer */
    .doc-pagination {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 50px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }
    .pagination-btn {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      min-width: 180px;
      font-family: inherit;
    }
    .pagination-btn.next { text-align: right; margin-left: auto; }
    .pagination-btn:hover {
      border-color: var(--cyan);
      background: var(--bg-card);
      transform: translateY(-1px);
    }
    .pagination-label { font-size: 0.72rem; text-transform: uppercase; color: var(--text-4); font-weight: 700; letter-spacing: 0.05em; }
    .pagination-title { font-size: 0.92rem; font-weight: 600; color: var(--text-1); margin-top: 2px; }

    /* Tier pills */
    .tier-pill {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      line-height: 1;
    }
    .tier-pill-all { background: rgba(255, 255, 255, 0.06); color: var(--text-3); border: 1px solid var(--border-subtle); }
    .tier-pill-mvp { background: rgba(56, 189, 248, 0.12); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.3); }
    .tier-pill-prod { background: rgba(245, 158, 11, 0.12); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tier-pill-scale { background: rgba(129, 140, 248, 0.12); color: var(--purple); border: 1px solid rgba(129, 140, 248, 0.3); }

    /* Method Badges */
    .badge-method {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .method-get { background: rgba(16, 185, 129, 0.15); color: var(--emerald); }
    .method-post { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }

    /* Right In-Page TOC */
    .app-toc {
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      padding: 32px 20px 40px;
      overflow-y: auto;
    }
    .toc-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-4);
      margin-bottom: 12px;
      font-weight: 700;
    }
    .toc-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 1px solid var(--border-subtle);
      padding-left: 12px;
    }
    .toc-a {
      color: var(--text-4);
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.15s ease;
      line-height: 1.45;
      display: block;
    }
    .toc-a:hover { color: var(--text-2); }
    .toc-a.active { color: var(--cyan); font-weight: 600; }

    /* Command Palette Modal */
    .palette-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 14vh;
    }
    .palette-backdrop.open { display: flex; }
    .palette-window {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);

    "title": "Safe Zero-Downtime Database Migration (`safe-db-migration`)",
    "tier": "ALL TIERS",
    "objective": "Operational procedure.",
    "steps": [
      {
        "title": "Pre-Migration Lock & Capacity Audit (`05-backend-data`)",
        "details": "1. Check table size and row count:\n   ```sql\n   SELECT pg_size_pretty(pg_total_relation_size('users')), count(*) FROM users;\n   ```\n2. Determine lock requirements of proposed operation (avoid table re-writes).\n3. Always mandate lock timeouts in migration scripts:\n   ```sql\n   SET lock_timeout = '2s';\n   ```"
      },
      {
        "title": "Phase 1 — Expand (Release N) (`05-backend-data` + `02-architecture`)",
        "details": "1. Add new column as nullable or with safe default (in PostgreSQL 11+, `DEFAULT` does not rewrite tables):\n   ```sql\n   SET lock_timeout = '2s';\n   ALTER TABLE users ADD COLUMN full_phone VARCHAR(32);\n   ```\n2. Deploy Release N application code:\n   - **Reads:** Read from legacy column (`phone`).\n   - **Writes:** Dual-write to BOTH legacy (`phone`) and new column (`full_phone`)."
      },
      {
        "title": "Phase 2 — Online Asynchronous Backfill (`05-backend-data`)",
        "details": "1. Backfill existing historical rows in small, batched chunks to avoid locking or replication lag:\n   ```sql\n   UPDATE users \n   SET full_phone = phone \n   WHERE id >= $min_id AND id < $max_id AND full_phone IS NULL;\n   ```\n2. Sleep 50ms between batches of 1,000 rows.\n3. Monitor database replication lag and CPU throughout the backfill."
      },
      {
        "title": "Phase 3 — Switch Reads & Enforce Constraints (`05-backend-data`)",
        "details": "1. Deploy Release N+1 application code:\n   - **Reads:** Read exclusively from new column (`full_phone`).\n   - **Writes:** Continue dual-writing to both columns.\n2. If `NOT NULL` is required, validate without table rewrite:\n   ```sql\n   SET lock_timeout = '2s';\n   ALTER TABLE users ADD CONSTRAINT check_full_phone_not_null CHECK (full_phone IS NOT NULL) NOT VALID;\n   ALTER TABLE users VALIDATE CONSTRAINT check_full_phone_not_null;\n   ```"
      },
      {
        "title": "Phase 4 — Contract & Cleanup (Release N+2) (`05-backend-data`)",
        "details": "1. Deploy Release N+2 application code:\n   - Remove all code references to legacy column (`phone`).\n2. Run final cleanup migration:\n   ```sql\n   SET lock_timeout = '2s';\n   ALTER TABLE users DROP COLUMN phone;\n   ```"
      },
      {
        "title": "Concurrent Index Creation (`05-backend-data`)",
        "details": "1. If creating indexes on tables with >10k rows, never use standard `CREATE INDEX` (which locks writes).\n2. Mandate concurrent index creation:\n   ```sql\n   CREATE INDEX CONCURRENTLY idx_users_full_phone ON users(full_phone);\n   ```\n\n---\n\n## 3. Quality Gates\n- **Backend Gate (`05-backend-data`):** Lock timeout <= 2s declared; no single-step renames on live tables.\n- **DevOps Gate (`09-devops-infra`):** Database replication lag < 1s; automated rollback script verified.\n- **QA Gate (`08-testing-qa`):** Dual-write and backfill data parity validated.\n\n---\n\n## 4. Rollback Procedure\nIf any migration step exceeds lock timeout or causes connection pool exhaustion:\n1. Migration automatically aborts due to `SET lock_timeout = '2s'`.\n2. Application remains operational because dual-write / backward-compatible code is deployed.\n3. If Phase 1 must be reverted: drop the newly added column (`ALTER TABLE users DROP COLUMN full_phone;`).\n\n---\n\n## 5. Evidence Required to Call Done\n1. Migration executed successfully in staging database with active synthetic load.\n2. Data validation query showing 100% parity between legacy and new columns.\n3. PostgreSQL query output confirming zero table lock stalls or connection pool spikes."

lameless Culture Affirmation\n*This postmortem is conducted with the understanding that every team member made the best decision possible based on the information and tools available to them at the time. Our focus is strictly on fixing systemic engineering flaws and automated guardrails.*\n\n"

    "content": "# Production Operations Runbook\n\n> **Schema Conformance:** `templates/schemas/runbook.schema.json`  \n> **Author:** `09-devops-infra`  \n> **Authority Status:** APPROVED | REJECTED\n\n---\n\n## 1. Service Overview\n- **Service Name:** [Service Name]\n- **Environment:** [staging | production]\n- **Target Tier:** [MVP | PROD | SCALE]\n- **On-Call Lead:** [Name / Slack handle]\n\n## 2. Standard Deployment Procedure\n| Step | Action / Command | Expected Output | Timeout |\n|---|---|---|---|\n| 1 | `git checkout main && git pull` | Clean working tree | 30s |\n| 2 | `pnpm run db:migrate` | Migrations applied with `SET lock_timeout = '2s'` | 60s |\n| 3 | `docker compose up -d --build` | Container started | 120s |\n| 4 | `curl -f http://localhost:3000/api/health/readiness` | HTTP 200 `{\"status\":\"ready\"}` | 10s |\n\n## 3. Automated Health Checks\n- **Liveness Endpoint:** `/api/health/liveness` (Target: HTTP 200, timeout 3s)\n- **Readiness Endpoint:** `/api/health/readiness` (Target: HTTP 200, checks DB and Cache)\n\n## 4. Automated Rollback Procedure\n- **Trigger Conditions:** `/api/health/readiness` returns non-200 for 3 consecutive intervals OR error rate > 1.0%.\n- **Rollback Command:** `./scripts/rollback.sh [previous_image_sha]`\n- **Maximum Allowed Downtime:** < 60 seconds.\n- **Rollback Verified in Staging:** Yes / No\n\n## 5. Metric Thresholds & Alert Actions\n| Metric | Threshold | Action |\n|---|---|---|\n| HTTP 5xx Error Rate | > 1.0% over 5 min | PagerDuty alert to on-call engineer |\n| Database CPU | > 80% over 10 min | Inspect `pg_stat_statements` for runaway queries |\n| Worker Queue Depth | > 500 unprocessed jobs | Horizontally scale worker container instances |\n\n"

    // Helper: Formats plain markdown with bold, italic, code, and bullet lists
    function formatProse(text) {
      if (!text) return '';
      let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^\*]+)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');

      const lines = escaped.split('\n');
      let html = '';
      let inList = false;

      for (let line of lines) {
        let trimmed = line.trim();
        if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          if (!inList) { html += '<ul class="doc-list">'; inList = true; }
          html += '<li>' + trimmed.substring(2) + '</li>';
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          if (trimmed.length > 0) {
            html += '<p class="doc-paragraph">' + trimmed + '</p>';
          }
        }
      }
      if (inList) html += '</ul>';
      return html;
    }

    function updateChecklistProgress(total) {
      const checked = document.querySelectorAll('#content input[type="checkbox"]:checked').length;
      const pct = Math.round((checked / total) * 100);
      const textEl = document.getElementById('checklistProgressText');
      const barEl = document.getElementById('checklistProgressBar');
      if (textEl) textEl.innerText = `${checked} / ${total} (${pct}%)`;
      if (barEl) barEl.style.width = pct + '%';
    }

    function copyChecklistReport(title, total) {
      const inputs = document.querySelectorAll('#content input[type="checkbox"]');
      let report = `# Audit Report: ${title}\n**Generated:** ${new Date().toISOString()}\n\n`;
      let checked = 0;
      inputs.forEach(input => {
        const itemText = input.getAttribute('data-item') || input.nextElementSibling?.innerText || 'Audit Item';
        if (input.checked) {
          checked++;
          report += `- [x] ${itemText}\n`;
        } else {
          report += `- [ ] ${itemText}\n`;
        }
      });
      report += `\n**Summary:** ${checked} / ${total} checks passing (${Math.round((checked / total) * 100)}%)\n`;
      copyText(report, null);
      alert('Audit Report copied to clipboard (' + checked + '/' + total + ' verified)!');
    }

    // =========================================================================
    // COMMAND PALETTE SEARCH ENGINE (Ctrl+K / ⌘K / /)
    // =========================================================================

    function openPalette() {
      const backdrop = document.getElementById('paletteBackdrop');
      backdrop.classList.add('open');
      const input = document.getElementById('paletteInput');
      input.value = '';
      input.focus();
      filterPalette();
    }

    function closePalette() {
      document.getElementById('paletteBackdrop').classList.remove('open');
    }

    function closePaletteOnBackdrop(e) {
      if (e.target.id === 'paletteBackdrop') closePalette();
    }

    function filterPalette() {
      const q = document.getElementById('paletteInput')?.value?.toLowerCase().trim() || '';
      const list = document.getElementById('paletteResults');
      if (!list) return;

      let items = [
        { type: 'Protocol', title: 'System Overview & Matrix', badge: 'Protocol', key: 'overview', text: 'overview architecture summary matrix' },
        { type: 'Protocol', title: '5-Second Quickstart', badge: 'Guide', key: 'quickstart', text: 'quickstart cli installer npm npx' },
        { type: 'Protocol', title: '3-Tier Rigor Matrix', badge: 'Architecture', key: 'tiers', text: 'tiers mvp prod scale matrix rigor' },
        { type: 'Protocol', title: 'Team Stances & Conflicts', badge: 'Governance', key: 'protocol', text: 'protocol stances conflict resolution' },
        { type: 'Protocol', title: 'Hard Vetos & Binding Gates', badge: 'Security', key: 'vetos', text: 'vetos gates security privacy sqat' },
        { type: 'Protocol', title: 'Zero AI Garbage Standard', badge: 'Quality', key: 'hygiene', text: 'hygiene zero ai garbage todo vibe' },
        { type: 'Tool', title: 'Tool Adapters (Cursor, Claude)', badge: 'Config', key: 'adapters', text: 'adapters cursor claude mdc instructions' }
      ];

      // Add Specialists
      SPECIALISTS.forEach(s => {
        items.push({
          type: 'Specialist',
          title: s.name,
          badge: s.auth,
          key: 'spec-' + s.id,
          text: s.name + ' ' + s.triggers.join(' ') + ' ' + s.id
        });
      });

      // Add Playbooks
      PLAYBOOKS.forEach(p => {
        items.push({
          type: 'Playbook',
          title: p.title,
          badge: p.tier,
          key: 'pb-' + p.slug,
          text: p.title + ' ' + p.slug + ' ' + p.objective
        });
      });

      // Add Checklists
      CHECKLISTS.forEach(c => {
        items.push({
          type: 'Checklist',
          title: c.title,
          badge: c.totalItems + ' items',
          key: 'checklist-' + c.id,
          text: c.title + ' ' + c.id
        });
      });

      // Add Templates
      TEMPLATES.forEach(t => {
        items.push({
          type: 'Template',
          title: t.title,
          badge: 'Schema',
          key: 'template-' + t.id,
          text: t.title + ' ' + t.id
        });
      });

      items.push({ type: 'Tool', title: 'Interactive ADR Builder', badge: 'Utility', key: 'adr-builder', text: 'adr builder form architecture' });
      items.push({ type: 'Eval', title: 'Empirical Benchmark Dashboard', badge: '+79.9% Delta', key: 'benchmarks', text: 'evals benchmark rubric results' });
      items.push({ type: 'Reference', title: '3 Golden Reference Projects', badge: '21 Tests', key: 'refprojects', text: 'reference projects mvp prod scale saas ecommerce' });

      const filtered = q ? items.filter(i => i.text.toLowerCase().includes(q)) : items.slice(0, 15);

      list.innerHTML = filtered.map(item => `
        <li class="palette-result-item" onclick="loadContent('${item.key}'); closePalette();">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="palette-result-badge">${item.type}</span>
            <span class="palette-result-title">${item.title}</span>
          </div>
          <span class="palette-result-badge">${item.badge}</span>
        </li>
      `).join('');
    }

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openPalette();
      } else if (e.key === 'Escape') {
        closePalette();
      } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('sidebarSearch')?.focus();
      }
    });

    function copyText(text, btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          if (btn) {
            const orig = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => { btn.innerText = orig; }, 1800);
          }
        });
      }
    }

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      renderNav();
      loadContent('overview');
