  <style>
    /* ==========================================================================
       USER-FRIENDLY DEVELOPER DOCUMENTATION THEME (Tailwind / Next.js / Stripe Style)
       ========================================================================== */
    :root {
      /* Clear, layered slate dark theme */
      --bg-base: #0b0f17;
      --bg-subtle: #0f1523;
      --bg-surface: #141b2d;
      --bg-card: #182238;
      --bg-card-hover: #1e2b46;
      --bg-code: #080c14;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(56, 189, 248, 0.5);
      
      /* High-contrast crisp typography */
      --text-1: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --text-4: #64748b;
      
      /* Vibrant semantics */
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.15);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #818cf8;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      background-color: var(--bg-base);
      color: var(--text-2);
      font-family: var(--font-sans);
      line-height: 1.75;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient Soft Top Glow */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 15%;
      right: 15%;
      height: 280px;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(56, 189, 248, 0.08), transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

    /* Accessible Skip Link */
    .skip-link {
      position: absolute;
      top: 10px;
      left: 16px;
      transform: translateY(-200%);
      background: var(--cyan);
      color: #040810;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 6px;
      z-index: 1000;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .skip-link:focus { transform: translateY(0); }

    .active-filter {
      background: var(--cyan) !important;
      color: #040810 !important;
      border-color: var(--cyan) !important;
    }

    /* Top Bar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 23, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-1);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      transition: color 0.15s ease;
    }
    .brand-link:hover { color: #fff; }
    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      flex-shrink: 0;
    }
    .version-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-3);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: 12px;
      line-height: 1;
    }
    .header-center { flex: 1; max-width: 480px; margin: 0 24px; }
    .palette-trigger {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-3);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .palette-trigger:hover {
      border-color: var(--border-medium);
      color: var(--text-2);
      background: var(--bg-card);
    }
    .palette-trigger-left { display: flex; align-items: center; gap: 8px; }
    .palette-trigger kbd {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      color: var(--text-3);
      white-space: nowrap;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-nav-link {
      color: var(--text-3);
      text-decoration: none;
      font-size: 0.83rem;
      font-weight: 500;
      transition: color 0.15s;
    }
    .header-nav-link:hover { color: var(--text-1); }
    .header-gh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
    }
    .header-gh-btn:hover { background: var(--bg-card); color: #fff; border-color: var(--border-medium); }

    /* App Layout */
    .app-body {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr) 240px;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 58px);
      position: relative;
      z-index: 1;
    }
    @media (max-width: 1280px) {
      .app-body { grid-template-columns: 280px minmax(0, 1fr); }
      .app-toc { display: none; }
    }
    @media (max-width: 860px) {
      .app-body { grid-template-columns: 1fr; }
      .app-nav { display: none; }
    }

    /* Left Navigation Sidebar */
    .app-nav {
      background: var(--bg-subtle);
      border-right: 1px solid var(--border-subtle);
      padding: 18px 12px 40px;
      height: calc(100vh - 58px);
      position: sticky;
      top: 58px;
      overflow-y: auto;
    }
    .sidebar-search-wrap { margin-bottom: 14px; padding: 0 4px; }
    .sidebar-search-input {

      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-1);

      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .sidebar-search-input:focus { border-color: var(--cyan); }

    .nav-group { margin-bottom: 8px; }
    .nav-group-header {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      color: var(--text-3);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .nav-group-header:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.04); }
    .nav-group-header-left { display: flex; align-items: center; gap: 7px; }
    .nav-chevron { color: var(--text-4); transition: transform 0.2s ease; flex-shrink: 0; }
    .nav-group.collapsed .nav-chevron { transform: rotate(-90deg); }
    .nav-group-count {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-4);
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 3px;
      padding-left: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: 12px;
    }
    .nav-group.collapsed .nav-list { display: none; }
    .nav-item-btn {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--text-3);
      font-size: 0.83rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      transition: all 0.15s ease;
      line-height: 1.4;
      text-decoration: none;
      font-family: inherit;
    }
    .nav-item-btn:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.05); }
    .nav-item-btn.active {
      color: #fff;
      background: var(--bg-card);
      font-weight: 600;
      border-left: 2px solid var(--cyan);
      border-radius: 0 6px 6px 0;
    }
    .nav-item-num {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 1px 5px;
      border-radius: 4px;
      min-width: 24px;
      text-align: center;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Center Main Content */
    .app-main {
      padding: 40px 52px 100px;
      max-width: 880px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 700px) {
      .app-main { padding: 24px 18px 80px; }
    }

    /* Content Typography & Header */
    .content-header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 20px;
    }
    .doc-cat {
      font-family: var(--font-mono);

    }
    .doc-heading {
      font-size: 1.95rem;
      font-weight: 700;
      color: var(--text-1);

    }
    .doc-intro {

    }
    .doc-block { margin-bottom: 38px; }
    .doc-subheading {
      font-size: 1.25rem;
      font-weight: 600;

      letter-spacing: -0.01em;

      padding-bottom: 8px;

    .doc-paragraph {

      font-size: 0.95rem;
      line-height: 1.75;
    }
    .doc-list {
      margin: 0 0 16px 20px;
      color: var(--text-2);
      font-size: 0.95rem;
      line-height: 1.75;
    }
    .doc-list li { margin-bottom: 6px; }
    .inline-code {
      font-family: var(--font-mono);
      font-size: 0.84em;
      background: rgba(255, 255, 255, 0.07);
      color: var(--cyan);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.06);

    /* Quick Install Hero Box */
    .quick-install-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      padding: 12px 18px;
      margin: 20px 0 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);

    .quick-install-command {

      align-items: center;

      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: #fff;
    }
    .prompt-symbol { color: var(--cyan); font-weight: 700; user-select: none; }

    /* Segmented Tab Bar */
    .page-tabs-bar {
      display: flex;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
      overflow-x: auto;
    }
    .page-tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      color: var(--text-3);
      font-size: 0.83rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;

    .page-tab-btn:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.04); }

      background: var(--bg-card);

      border: 1px solid var(--border-medium);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards & Elevated Containers */
    .clean-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 14px;
      transition: all 0.15s ease;
    }
    .callout-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;
      padding: 14px 18px;
      margin: 18px 0;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .callout-box.alert-veto { border-left-color: var(--rose); background: rgba(244, 63, 94, 0.06); }
    .callout-box.alert-ship { border-left-color: var(--purple); background: rgba(129, 140, 248, 0.06); }
    .callout-box.alert-gate { border-left-color: var(--cyan); }

    /* Tables */
    .spec-table-box {
      overflow-x: auto;
      margin: 18px 0 24px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: var(--bg-surface);
    }
    .spec-table-box table { width: 100%; border-collapse: collapse; font-size: 0.86rem; text-align: left; }
    .spec-table-box th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-3);
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .spec-table-box td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-2);
      vertical-align: top;
    }
    .spec-table-box tr:last-child td { border-bottom: none; }

    /* Code Snippets */
    .code-snippet-box {
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin: 14px 0 20px;
      overflow: hidden;
    }
    .snippet-top {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      font-family: var(--font-mono);
      color: var(--text-3);
    }
    .snippet-copy-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-2);

      padding: 3px 8px;
      border-radius: 4px;
      font-family: inherit;

      align-items: center;

      transition: all 0.15s;

    .snippet-copy-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.12); border-color: var(--border-medium); }
    .code-snippet-box pre {
      padding: 16px 18px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.65;
      color: var(--text-2);
    }

    /* Action button */
    .hud-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--cyan);
      font-weight: 600;
      font-size: 0.83rem;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .hud-action-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--cyan);
      color: #fff;
    }

    /* Sequential Pagination Footer */
    .doc-pagination {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 50px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }
    .pagination-btn {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      min-width: 180px;
      font-family: inherit;
    }
    .pagination-btn.next { text-align: right; margin-left: auto; }
    .pagination-btn:hover {
      border-color: var(--cyan);
      background: var(--bg-card);
      transform: translateY(-1px);
    }
    .pagination-label { font-size: 0.72rem; text-transform: uppercase; color: var(--text-4); font-weight: 700; letter-spacing: 0.05em; }
    .pagination-title { font-size: 0.92rem; font-weight: 600; color: var(--text-1); margin-top: 2px; }

    /* Tier pills */
    .tier-pill {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      line-height: 1;

      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;

    .method-post { background: rgba(56, 189, 248, 0.15); color: var(--cyan); }

    /* Right In-Page TOC */
    .app-toc {
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      padding: 32px 20px 40px;
      overflow-y: auto;
    }
    .toc-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-4);
      margin-bottom: 12px;
      font-weight: 700;
    }
    .toc-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-left: 1px solid var(--border-subtle);
      padding-left: 12px;
    }
    .toc-a {
      color: var(--text-4);
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.15s ease;
      line-height: 1.45;
      display: block;
    }
    .toc-a:hover { color: var(--text-2); }
    .toc-a.active { color: var(--cyan); font-weight: 600; }

    /* Command Palette Modal */
    .palette-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 14vh;
    }
    .palette-backdrop.open { display: flex; }
    .palette-window {

    "authType": "gate",
    "directive": "The Orchestrator protects the engineering process, specialist routing, project scope, and artifact handoffs.",
    "triggers": [

      "build website",
      "bootstrap app",
      "fullstack",
      "plan sprint"
    ],
    "refuse": "I refuse to allow unverified assumptions, missing artifact schemas, unmanaged scope creep, or shipping code that bypasses designated specialist gates. I will never allow a project displaying public or commercial signals to be built at prototype rigor without explicit, documented user consent.",
    "questions": [
      "1. **Tier Identification:** What concrete signals (public users, auth, payments, data scale) determine whether this project is MVP, PROD, or SCALE?",
      "2. **Specialist Selection:** Which 2–5 specialists are strictly necessary for this task, and what exact schema defines each handoff artifact?",
      "3. **Evidence Verification:** Does each completed phase have runnable terminal verification before declaring completion or transitioning hats?\n\n---"
    ],
    "whenToUse": [
      "Starting any new website, full-stack application, or major feature.",
      "Triage is needed to break an ambiguous goal into concrete specialist tasks.",
      "Resolving cross-specialist conflicts (e.g. security vs performance vs speed).",
      "Reviewing phase gates before production deployment or handoff."
    ],
    "whenNotToUse": [
      "Fixing a narrow, single-domain issue already routed (e.g. styling a button → route directly to `04-frontend`; patching a SQL query → route to `05-backend-data`).",
      "Executing deep test suite writing without architectural changes (route to `08-testing-qa`)."
    ],
    "inputs": [
      "Raw user request or issue description.",
      "Current codebase directory structure and dependency files (`package.json`, etc.).",
      "`PROGRESS.md` and `DECISIONS.md`.",
      ""
    ],
    "outputs": [
      "Rigor Tier classification (MVP, PROD, SCALE) with supporting signals.",
      "Active Specialist Team selection (2–5 specialists routed via `skills.index.json`).",
      "Sequenced execution plan with explicit schema-defined artifact deliverables.",
      "Updated `PROGRESS.md` and recorded decisions in `DECISIONS.md`."
    ],
    "decisionRules": [
      {
        "title": "Rigor Tier Rule",
        "text": "- *If* the app touches public accounts, user email, payments, or sensitive data, *choose* **PROD** tier *because* security and data integrity failures have legal and financial consequences.\n   - *If* the app exceeds 100k MAU, processes high transaction volume, or requires strict SLAs, *choose* **SCALE** tier *because* concurrency and failure cascades require distributed isolation.\n   - *Otherwise*, *choose* **MVP** tier *because* speed to validation takes priority for internal prototypes."
      },
      {
        "title": "Context Budget Rule",
        "text": "- *If* routing specialists, *choose* at most 2 to 5 specialists per phase *because* loading excessive skills wastes tokens and degrades agent focus."
      },
      {
        "title": "Conflict Resolution Rule",
        "text": "- *If* specialists disagree on implementation, *enforce* order: **Security/Privacy > Architecture > Performance > Speed** *because* vulnerable or unlawful code is an existential failure.\n\n---"
      }
    ],
    "steps": [
      {
        "title": "Intake & Rigor Tier Classification [MVP] [PROD] [SCALE]",
        "details": "1. Read the user prompt and inspect existing repository state.\n2. Scan for tier signals:\n   - PROD signals: public internet exposure, user credentials/email, checkout/Stripe, persistent user data.\n   - SCALE signals: >100k MAU, spiky traffic, high-volume money movement, multi-tenant data, strict SLAs.\n3. Classify at the **HIGHEST** triggered tier. If PROD signals exist on an MVP request, ask the user once to confirm or downgrade; record any override in `DECISIONS.md` under `ACCEPTED-RISK`."
      },
      {
        "title": "Route Specialists via `skills.index.json` [MVP] [PROD] [SCALE]",
        "details": "1. Read `skills.index.json`. Match keywords in user prompt against `triggers` and filter out `anti_triggers`.\n2. Select 2–5 specialists for the current phase.\n3. Determine execution mode:\n   - **MULTI-AGENT**: If environment supports subagents, invoke them with role-specific system prompts.\n   - **SINGLE-AGENT**: Announce active hat `[Wearing: <Specialist Role>]`, execute procedure, and hand off artifact."
      },
      {
        "title": "Phase Execution & Schema Handoff [MVP] [PROD] [SCALE]",
        "details": "1. Require each specialist to produce its schema-defined artifact in `templates/schemas/`:\n   - Product Discovery → `prd.schema.json`\n   - Solution Architecture → `adr.schema.json`\n   - Security → `threat-model.schema.json`\n   - QA → `test-report.schema.json`\n   - DevOps → `runbook.schema.json`\n   - Launch → `launch-report.schema.json`\n2. Block downstream specialists if required input schema is missing or invalid."
      },
      {
        "title": "Quality Gate Enforcement [PROD] [SCALE]",
        "details": "1. Enforce mandatory gates before releasing code:\n   - Security HARD VETO: Zero critical or high OWASP vulnerabilities.\n   - Privacy HARD VETO: Documented lawful basis and cookie consent.\n   - QA Gate: Automated test suite executed with passing exit code.\n   - DevOps Gate: Automated rollback procedure verified.\n2. If any gate fails, halt release immediately. Either resolve the issue or obtain written user sign-off logged as `ACCEPTED-RISK`."
      },
      {
        "title": "Update State & Status Formatting [MVP] [PROD] [SCALE]",
        "details": "1. Update `PROGRESS.md` with task completion and gate status.\n2. Record any architectural or scope trade-offs in `DECISIONS.md`.\n3. Format output following the mandatory 5-part status format.\n\n---"
      }
    ],
    "antiPatterns": [
      "**Silent Demotion:** Downgrading a production web store to MVP rigor without explicit user consent.",
      "**Context Flooding:** Instructing the agent to read all 15 skills simultaneously.",
      "**Hallucinated Handoffs:** Passing unvalidated assumptions to developers instead of schema-validated PRDs or ADRs.",
      "**Rubber-Stamping Gates:** Claiming security or QA passed without terminal execution proof.\n\n---"
    ],
    "verifications": [
      "Run these verification steps to prove orchestrator integrity:",
      "1. Verify `skills.index.json` is valid JSON and all 15 skills exist on disk:\n   ```bash\n   node -e \"const d = require('./skills.index.json'); console.log('Skills loaded:', d.skills.length === 15 ? 'PASS' : 'FAIL');\"\n   ```\n   *Expected output:* `Skills loaded: PASS`",
      "2. Verify `PROGRESS.md` reflects the current active phase and gate:\n   ```bash\n   node -e \"const fs = require('fs'); const p = fs.readFileSync('PROGRESS.md', 'utf8'); console.log('Progress tracked:', p.includes('Current Phase') ? 'PASS' : 'FAIL');\"\n   ```\n   *Expected output:* `Progress tracked: PASS`\n\n---"
    ],
    "escalate": [
      "A user request involves public authentication or payments, but asks to bypass security or tests.",
      "An irreversible action is required: deleting database tables, dropping schemas, force-pushing, or incurring cloud costs.",
      "Requirements are fundamentally contradictory (e.g. strict GDPR compliance requested alongside covert tracking without user consent)."
    ]
  },
  {
    "id": "01-product-discovery",
    "num": "01",
    "name": "Product Lead",
    "authority": "Advises",
    "authType": "standard",
    "directive": "The Product Lead protects problem-solution fit, minimal viable scope, user clarity, and verifiable business value.",
    "triggers": [
      "product requirements",
      "prd",
      "user stories",
      "personas",
      "jtbd",
      "moscow cut"
    ],
    "refuse": "I refuse to permit building features without an identified user problem, unprioritized kitchen-sink scope lists, vague success metrics, or launching initiatives without predefined kill criteria. Every feature must earn its development cost.",
    "questions": [
      "1. **The Core Job-to-be-Done:** What specific painful job is the user trying to accomplish, and what workaround are they currently using today?",
      "2. **The MoSCoW Cut:** What is the absolute smallest slice of functionality (Must-Haves) that allows a user to complete this job from start to finish?",
      "3. **Kill Criteria & Metrics:** What measurable metric determines whether this feature succeeded or failed within 30 days of launch, and at what threshold do we pull the plug?\n\n---"
    ],
    "whenToUse": [
      "Ingesting a new product idea, feature request, or ambiguous user concept.",
      "Authoring a formal Product Requirements Document (`prd.schema.json`).",
      "Pruning an over-scoped backlog into a tight, testable MVP.",
      "Defining user personas, user stories, and acceptance criteria.",
      "Setting up customer feedback loops and quantitative success metrics."
    ],
    "whenNotToUse": [
      "Choosing database schemas or API protocols (route to `02-architecture`).",
      "Auditing software for security vulnerabilities (route to `06-security`).",
      "Writing code or unit test suites (route to `04-frontend` / `05-backend-data`)."
    ],
    "inputs": [
      "Raw user request, business vision, or customer interview transcripts.",
      "Existing product state and competitor context.",
      ""
    ],
    "outputs": [
      "Product Requirements Document conforming to `templates/schemas/prd.schema.json`.",
      "Feature prioritization matrix (Must / Should / Could / Won't).",
      "Measurable success metrics and kill criteria."
    ],
    "decisionRules": [
      {
        "title": "MoSCoW Scoping Rule",
        "text": "- *If* a feature does not directly enable the primary Job-to-be-Done or block launch compliance, *relegate it* to **Should Have** or **Could Have** *because* shipping late with bloat destroys feedback cycles [BEST PRACTICE: SHAPE-UP].\n   - *Limit* Must-Haves to at most 3 to 5 core capabilities for any single release cycle."
      },
      {
        "title": "Acceptance Criteria Precision Rule",
        "text": "- *Never* write subjective criteria like \"The UI should look clean and fast\"; *mandate* testable statements in Given-When-Then format (e.g. \"Given an unauthenticated user, when they click Checkout, then they are redirected to /login with return_to param\") *because* ambiguity in PRDs creates downstream implementation drift [BEST PRACTICE: LEAN-STARTUP]."
      },
      {
        "title": "Kill Criteria Rule",
        "text": "- *Every* feature PRD must specify an explicit condition for decommissioning (e.g. \"If fewer than 5% of active users use this feature after 60 days, deprecate and remove the code\") *because* dead code creates permanent maintenance drag.\n\n---"
      }
    ],
    "steps": [
      {
        "title": "JTBD Problem Extraction [MVP] [PROD] [SCALE]",
        "details": "1. Frame the user problem:\n   - \"When [situation], I want to [motivation], so I can [expected outcome].\"\n2. Identify existing manual workarounds (spreadsheets, manual emails, copy-pasting).\n3. Validate that the proposed feature offers at least a 10x improvement in speed, cost, or convenience over the workaround."
      },
      {
        "title": "MoSCoW Categorization & Scope Cut [MVP] [PROD] [SCALE]",
        "details": "1. List all requested feature elements.\n2. Force brutal prioritization into 4 buckets:\n   - **Must Have:** The product cannot function or launch without this.\n   - **Should Have:** Important and high-value, but a workaround exists for launch.\n   - **Could Have:** Nice-to-have enhancements if time permits.\n   - **Won't Have (This Cycle):** Explicitly agreed out-of-scope items.\n3. Defend against scope creep: when stakeholders request additions, trade off an existing Must-Have rather than expanding the release date."
      },
      {
        "title": "Acceptance Criteria & User Stories [MVP] [PROD] [SCALE]",
        "details": "1. Break Must-Haves into granular user stories.\n2. Author unambiguous acceptance criteria with testable boundaries:\n   - Positive validation cases.\n   - Error messages and failure recovery expectations.\n   - Data limits and format requirements."
      },
      {
        "title": "Metric Definition & Handoff [MVP] [PROD] [SCALE]",
        "details": "1. Define primary adoption metric and baseline target.\n2. Define kill criteria threshold.\n3. Validate and output `prd.schema.json`. Hand off to `02-architecture` and `03-ux-ui-design`.\n\n---"
      }
    ],
    "antiPatterns": [
      "**Kitchen-Sink PRDs:** Writing a 40-page document with 50 features before validating if users want the core value proposition.",
      "**Vague Acceptance Criteria:** Writing \"Must be user-friendly\" or \"Fast response\" without measurable numbers or states.",
      "**Undocumented Out-of-Scope:** Omitting the \"Won't Have\" section, leading to endless arguments about implied scope.",
      "**Building for Non-Existent Personas:** Designing features for hypothetical enterprise buyers when the current users are freelance designers.\n\n---"
    ],
    "verifications": [
      "Run these automated verification checks:",
      "1. Verify that `SKILL.md` contains all required sections:\n   ```bash\n   node -e \"\n   const fs = require('fs');\n   const text = fs.readFileSync('skills/01-product-discovery/SKILL.md', 'utf8');\n   const required = ['Specialist Stance', 'When to Use', 'Inputs and Outputs', 'Decision Rules', 'Procedure', 'Anti-Patterns', 'Verification'];\n   const missing = required.filter(r => !text.includes(r));\n   console.log('Product skill structure:', missing.length === 0 ? 'PASS' : 'FAIL: ' + missing.join(', '));\n   \"\n   ```\n   *Expected output:* `Product skill structure: PASS`\n\n---"
    ],
    "escalate": [
      "The stakeholder refuses to select any item for the \"Won't Have\" list, demanding an un-tiered kitchen-sink release.",
      "The core problem statement changes fundamentally during discovery (e.g. pivoting from B2C consumers to B2B enterprise procurement).",
      "Discovery reveals an established competitor offering the exact same solution for free with high satisfaction."
    ]
  },
  {
    "id": "02-architecture",
    "num": "02",
    "name": "Solution Architect",
    "authority": "Design gate",
    "authType": "standard",
    "directive": "The Solution Architect protects fit-for-purpose technical design, domain data integrity, API boundaries, and long-term cost sustainability. I hold the **Design Gate** over major technical decisions.",
    "triggers": [
      "architecture",
      "system design",
      "adr",
      "monolith vs microservices",

    "steps": [
      {
        "title": "Diagnose LCP Element & Sub-Parts (`10-performance`)",
        "details": "1. Run Chrome DevTools Performance profile or Lighthouse on simulated 4G mobile.\n2. Identify the specific DOM node registered as the LCP element (e.g. `<img>`, `<video>`, or block-level text element).\n3. Deconstruct the LCP time into 4 sub-parts:\n   - **TTFB (Time to First Byte):** Target < 800ms.\n   - **Resource Load Delay:** Target < 200ms.\n   - **Resource Load Duration:** Target < 1000ms.\n   - **Element Render Delay:** Target < 500ms."
      },
      {
        "title": "Remediate Resource Load Delay (`10-performance` + `04-frontend`)",
        "details": "1. Remove `loading=\"lazy\"` from the LCP image element immediately (lazy loading the hero image is an anti-pattern that severely delays loading).\n2. Inject priority hint in HTML `<head>`:\n   ```html\n   <link rel=\"preload\" as=\"image\" href=\"/hero.avif\" fetchpriority=\"high\" type=\"image/avif\">\n   ```\n3. Set `fetchpriority=\"high\"` directly on the `<img>` tag:\n   ```html\n   <img src=\"/hero.webp\" fetchpriority=\"high\" decoding=\"async\" alt=\"...\">\n   ```"
      },
      {
        "title": "Compress and Resize Media (`10-performance`)",
        "details": "1. Convert PNG/JPEG hero images to modern AVIF format with fallback WebP.\n2. Implement responsive `srcset` with `sizes` so mobile devices download an appropriately sized ~50kB image rather than a 2MB desktop asset:\n   ```html\n   <picture>\n     <source type=\"image/avif\" srcset=\"/hero-400.avif 400w, /hero-800.avif 800w\" sizes=\"(max-width: 600px) 100vw, 800px\">\n     <img src=\"/hero-800.webp\" width=\"800\" height=\"450\" alt=\"...\">\n   </picture>\n   ```"
      },
      {
        "title": "Eliminate Render-Blocking Resources (`04-frontend`)",
        "details": "1. Eliminate external `@import url(...)` in CSS files.\n2. Self-host WOFF2 fonts with `font-display: swap` to prevent Flash of Invisible Text (FOIT).\n3. Ensure non-critical JavaScript scripts use `defer` or `async` so they do not block HTML parsing."
      },
      {
        "title": "CDN Edge Caching & Compression (`09-devops-infra`)",
        "details": "1. Verify edge CDN serves static assets with Brotli compression (`Content-Encoding: br`).\n2. Configure immutable caching headers on static images:\n   ```http\n   Cache-Control: public, max-age=31536000, immutable\n   ```"
      },
      {
        "title": "Verify with Automated Lighthouse CI (`08-testing-qa`)",
        "details": "1. Run automated performance audit in CI:\n   ```bash\n   npx lhci autorun\n   ```\n2. Assert LCP <= 2.5 seconds on simulated mobile 4G throttle.\n\n---\n\n## 3. Quality Gates\n- **Performance Gate (`10-performance`):** LCP must be strictly under 2.5 seconds (75th percentile).\n- **QA Gate (`08-testing-qa`):** Zero visual regression or layout shift (CLS <= 0.1) caused by image resizing.\n\n---\n\n## 4. Rollback Procedure\nIf asset conversion breaks image rendering in older browsers:\n1. Re-enable fallback WebP and JPEG picture sources.\n2. Purge CDN edge cache: `npx cloudflare-cli purge --all`.\n\n---\n\n## 5. Evidence Required to Call Done\n1. Terminal Lighthouse CI output showing LCP score < 2.5s with green status.\n2. Network waterfall trace showing LCP image request starts downloading in the first critical network chunk."

        "details": "1. Backfill existing historical rows in small, batched chunks to avoid locking or replication lag:\n   ```sql\n   UPDATE users \n   SET full_phone = phone \n   WHERE id >= $min_id AND id < $max_id AND full_phone IS NULL;\n   ```\n2. Sleep 50ms between batches of 1,000 rows.\n3. Monitor database replication lag and CPU throughout the backfill."

    "content": "# Performance & Core Web Vitals Audit Report\n\n> **Schema Conformance:** `templates/schemas/perf-audit.schema.json`  \n> **Author:** `10-performance`  \n> **Overall Status:** PASS | WARN | FAIL\n\n---\n\n## 1. Audit Metadata\n- **Timestamp:** [ISO 8601 Timestamp]\n- **Target URL:** [e.g. `https://app.example.com/products/view`]\n- **Audited Profile:** [Mobile 4G (Emulated) / Desktop Broadband]\n- **Overall Status:** [PASS | WARN | FAIL]\n\n---\n\n## 2. Core Web Vitals Scorecard\n\n| Metric | Measured Value | Standard Target | Status |\n|---|---|---|---|\n| **Largest Contentful Paint (LCP)** | [e.g. 1.8s] | $\\le 2.5\\text{s}$ | [PASS / WARN / FAIL] |\n| **Interaction to Next Paint (INP)** | [e.g. 110ms] | $\\le 200\\text{ms}$ | [PASS / WARN / FAIL] |\n| **Cumulative Layout Shift (CLS)** | [e.g. 0.02] | $\\le 0.1$ | [PASS / WARN / FAIL] |\n\n---\n\n## 3. Asset Breakdown & Budgets\n\n| Asset Category | Transfer Size (Gzip/Brotli) | Budget Limit | Status |\n|---|---|---|---|\n| **Total JavaScript** | [e.g. 142 KB] | $\\le 170\\text{ KB}$ | [PASS / OVER BUDGET] |\n| **Total CSS** | [e.g. 24 KB] | $\\le 50\\text{ KB}$ | [PASS / OVER BUDGET] |\n| **Total Images** | [e.g. 380 KB] | $\\le 500\\text{ KB}$ | [PASS / OVER BUDGET] |\n| **Total Fonts** | [e.g. 45 KB] | $\\le 60\\text{ KB}$ | [PASS / OVER BUDGET] |\n\n---\n\n## 4. Key Bottlenecks Identified\n\n1. **[Bottleneck 1 Title]:** [Detailed description of request waterfall, render-blocking asset, or main thread task > 50ms].\n2. **[Bottleneck 2 Title]:** [Detailed description of unoptimized image or missing priority hint].\n\n---\n\n## 5. Prioritized Remediation Action Items\n\n- [ ] **Priority 1 (LCP):** [e.g. Add `<link rel=\"preload\" as=\"image\" fetchpriority=\"high\">` to hero asset].\n- [ ] **Priority 2 (CLS):** [e.g. Reserve aspect-ratio on ad slots and dynamic content containers].\n- [ ] **Priority 3 (INP):** [e.g. Break up long script task via `scheduler.yield()` or Web Worker].\n\n"

    "content": "# Blameless Incident Postmortem\n\n> **Schema Conformance:** `templates/schemas/postmortem.schema.json`  \n> **Author:** `13-launch-operations` + `09-devops-infra`  \n> **Status:** Published\n\n---\n\n## 1. Incident Summary\n- **Incident ID:** [INC-YYYY-XXXX]\n- **Severity Level:** [SEV1 | SEV2 | SEV3 | SEV4]\n- **Incident Date:** [YYYY-MM-DD]\n- **Duration / Outage Window:** [Start UTC] to [End UTC] ([X] minutes)\n- **Incident Commander:** [Name]\n\n## 2. Customer Impact\n- **Total Downtime:** [X] minutes\n- **Estimated Users Affected:** [X users]\n- **Financial / Revenue Impact:** [$X estimated lost sales or refunds]\n- **Customer Communications Sent:** [Status page updates, email notifications]\n\n## 3. Chronological Timeline (UTC)\n| Timestamp (UTC) | Event Description |\n|---|---|\n| `14:02` | Release v1.2.4 deployed to production cluster |\n| `14:05` | Automated health check fails on `/api/health/readiness` |\n| `14:08` | On-call engineer paged by automated PagerDuty alarm |\n| `14:12` | Incident Commander appointed; incident declared SEV1 |\n| `14:15` | Automated rollback command executed |\n| `14:18` | Rollback complete; health checks return HTTP 200 |\n| `14:25` | Synthetic smoke tests confirm full recovery; public all-clear posted |\n\n## 4. Root Cause Analysis (5-Whys)\n- **Direct Trigger:** [Immediate technical event triggering failure]\n- **Systemic Root Cause:** [Underlying gap in process, linting, testing, or architecture]\n- **The 5-Whys Progression:**\n  1. *Why did X fail?*\n  2. *Why did Y happen?*\n  3. *Why was Z not detected?*\n  4. *Why did process W allow it?*\n  5. *Root cause conclusion.*\n\n## 5. Corrective Action Items (No Human Blame)\n| Action Item | Preventative Type | Owner | Target Date | Status |\n|---|---|---|---|---|\n| [Add automated lint rule in CI] | [Testing / CI] | [DevOps Lead] | [YYYY-MM-DD] | [Open] |\n| [Implement query timeout guard] | [Code / Backend] | [Backend Lead] | [YYYY-MM-DD] | [Open] |\n\n## 6. B     // Helper: Formats plain markdown with bold, italic, code, and bullet lists
    function formatProse(text) {
      if (!text) return '';
      let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^\*]+)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
        .replace(/\[MVP\]/g, '<span class="tier-pill tier-pill-mvp" style="font-size:0.65rem; padding:1px 5px; margin-left:4px;">MVP</span>')
        .replace(/\[PROD\]/g, '<span class="tier-pill tier-pill-prod" style="font-size:0.65rem; padding:1px 5px; margin-left:4px;">PROD</span>')
        .replace(/\[SCALE\]/g, '<span class="tier-pill tier-pill-scale" style="font-size:0.65rem; padding:1px 5px; margin-left:4px;">SCALE</span>');

      const lines = escaped.split('\n');
      let html = '';
      let inUl = false;
      let inOl = false;
      let inCode = false;
      let codeBuffer = '';

      for (let line of lines) {
        let trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (!inCode) {
            if (inUl) { html += '</ul>'; inUl = false; }
            if (inOl) { html += '</ol>'; inOl = false; }
            inCode = true;
            codeBuffer = '';
          } else {
            inCode = false;
            html += '<pre class="code-block" style="background:var(--bg-code); padding:10px 14px; border-radius:6px; font-family:var(--font-mono); font-size:0.82rem; overflow-x:auto; margin:8px 0; border:1px solid var(--border-subtle); color:var(--text-1);"><code>' + codeBuffer + '</code></pre>';
            codeBuffer = '';
          }
          continue;
        }

        if (inCode) {
          codeBuffer += (codeBuffer ? '\n' : '') + line;
          continue;
        }

        if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
          if (inOl) { html += '</ol>'; inOl = false; }
          if (!inUl) { html += '<ul class="doc-list">'; inUl = true; }
          html += '<li>' + trimmed.substring(2) + '</li>';
        } else if (/^\d+\.\s+/.test(trimmed)) {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (!inOl) { html += '<ol class="doc-list" style="padding-left:22px; margin-bottom:12px;">'; inOl = true; }
          html += '<li style="margin-bottom:6px;">' + trimmed.replace(/^\d+\.\s+/, '') + '</li>';
        } else {
          if (inUl) { html += '</ul>'; inUl = false; }
          if (inOl) { html += '</ol>'; inOl = false; }
          if (trimmed.length > 0) {
            html += '<p class="doc-paragraph">' + trimmed + '</p>';
          }
        }
      }
      if (inUl) html += '</ul>';
      if (inOl) html += '</ol>';
      if (inCode) html += '<pre class="code-block" style="background:var(--bg-code); padding:10px 14px; border-radius:6px; font-family:var(--font-mono); font-size:0.82rem; overflow-x:auto; margin:8px 0; border:1px solid var(--border-subtle); color:var(--text-1);"><code>' + codeBuffer + '</code></pre>';
      return html;
    }

    function loadContent(key, btnElement = null) {
      document.querySelectorAll('.nav-item-btn').forEach(b => {
        b.classList.remove('active');
        const oc = b.getAttribute('onclick') || '';
        if (btnElement && b === btnElement) {
          b.classList.add('active');
        } else if (!btnElement && (oc.indexOf("'" + key + "'") !== -1 || oc.indexOf('"' + key + '"') !== -1)) {
          b.classList.add('active');
        }
      });

      if (window.history && window.history.replaceState && key && key !== 'content') {
        window.history.replaceState(null, '', '#' + key);
      }

      const main = document.getElementById('content');
      const toc = document.getElementById('tocLinksContainer');

      if (key === 'specialists') {
        document.getElementById('grp-specialists')?.classList.remove('collapsed');
        renderSpecialistsDirectoryPage(main, toc);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Expand parent accordion if collapsed
      if (key.startsWith('spec-')) {
        document.getElementById('grp-specialists')?.classList.remove('collapsed');
        const spec = SPECIALISTS.find(s => s.id === key.replace('spec-', ''));
        if (spec) renderSpecialistPage(spec, main, toc);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;

      if (key.startsWith('pb-')) {

      if (key.startsWith('template-')) {

          renderAdaptersPage(main, toc);
          break;
        case 'overview':

          renderOverviewPage(main, toc);
          break;

    }

    function updateChecklistProgress(total) {
      const checked = document.querySelectorAll('#content input[type="checkbox"]:checked').length;
      const pct = Math.round((checked / total) * 100);
      const textEl = document.getElementById('checklistProgressText');
      const barEl = document.getElementById('checklistProgressBar');
      if (textEl) textEl.innerText = `${checked} / ${total} (${pct}%)`;
      if (barEl) barEl.style.width = pct + '%';
    }

    function copyChecklistReport(title, total) {
      const inputs = document.querySelectorAll('#content input[type="checkbox"]');
      let report = `# Audit Report: ${title}\n**Generated:** ${new Date().toISOString()}\n\n`;
      let checked = 0;
      inputs.forEach(input => {
        const itemText = input.getAttribute('data-item') || input.nextElementSibling?.innerText || 'Audit Item';
        if (input.checked) {
          checked++;
          report += `- [x] ${itemText}\n`;
        } else {
          report += `- [ ] ${itemText}\n`;
        }
      });
      report += `\n**Summary:** ${checked} / ${total} checks passing (${Math.round((checked / total) * 100)}%)\n`;
      copyText(report, null);
      alert('Audit Report copied to clipboard (' + checked + '/' + total + ' verified)!');
    }

    // =========================================================================
    // COMMAND PALETTE SEARCH ENGINE (Ctrl+K / ⌘K / /)
    // =========================================================================

    function openPalette() {
      const backdrop = document.getElementById('paletteBackdrop');
      backdrop.classList.add('open');
      const input = document.getElementById('paletteInput');
      input.value = '';
      input.focus();
      filterPalette();
    }

    function closePalette() {
      document.getElementById('paletteBackdrop').classList.remove('open');
    }

    function closePaletteOnBackdrop(e) {
      if (e.target.id === 'paletteBackdrop') closePalette();
    }

    function filterPalette() {
      const q = document.getElementById('paletteInput')?.value?.toLowerCase().trim() || '';
      const list = document.getElementById('paletteResults');
      if (!list) return;

      let items = [
        { type: 'Protocol', title: 'System Overview & Matrix', badge: 'Protocol', key: 'overview', text: 'overview architecture summary matrix' },
        { type: 'Protocol', title: 'All 15 Specialists Complete Guide', badge: 'Protocol', key: 'specialists', text: 'specialists guide matrix directory roster all 15 roles' },
        { type: 'Protocol', title: '5-Second Quickstart', badge: 'Guide', key: 'quickstart', text: 'quickstart cli installer npm npx' },
        { type: 'Protocol', title: '3-Tier Rigor Matrix', badge: 'Architecture', key: 'tiers', text: 'tiers mvp prod scale matrix rigor' },
        { type: 'Protocol', title: 'Team Stances & Conflicts', badge: 'Governance', key: 'protocol', text: 'protocol stances conflict resolution' },
        { type: 'Protocol', title: 'Hard Vetos & Binding Gates', badge: 'Security', key: 'vetos', text: 'vetos gates security privacy sqat' },
        { type: 'Protocol', title: 'Zero AI Garbage Standard', badge: 'Quality', key: 'hygiene', text: 'hygiene zero ai garbage todo vibe' },
        { type: 'Tool', title: 'Tool Adapters (Cursor, Claude)', badge: 'Config', key: 'adapters', text: 'adapters cursor claude mdc instructions' }
      ];

      // Add Specialists
      SPECIALISTS.forEach(s => {
        items.push({
          type: 'Specialist',
          title: s.name,
          badge: s.auth,
          key: 'spec-' + s.id,
          text: s.name + ' ' + s.triggers.join(' ') + ' ' + s.id
        });
      });

      // Add Playbooks
      PLAYBOOKS.forEach(p => {
        items.push({
          type: 'Playbook',
          title: p.title,
          badge: p.tier,
          key: 'pb-' + p.slug,
          text: p.title + ' ' + p.slug + ' ' + p.objective
        });
      });

      // Add Checklists
      CHECKLISTS.forEach(c => {
        items.push({
          type: 'Checklist',
          title: c.title,
          badge: c.totalItems + ' items',
          key: 'checklist-' + c.id,
          text: c.title + ' ' + c.id
        });
      });

      // Add Templates
      TEMPLATES.forEach(t => {
        items.push({
          type: 'Template',
          title: t.title,
          badge: 'Schema',
          key: 'template-' + t.id,
          text: t.title + ' ' + t.id
        });
      });

      items.push({ type: 'Tool', title: 'Interactive ADR Builder', badge: 'Utility', key: 'adr-builder', text: 'adr builder form architecture' });
      items.push({ type: 'Eval', title: 'Empirical Benchmark Dashboard', badge: '+79.9% Delta', key: 'benchmarks', text: 'evals benchmark rubric results' });
      items.push({ type: 'Reference', title: '3 Golden Reference Projects', badge: '21 Tests', key: 'refprojects', text: 'reference projects mvp prod scale saas ecommerce' });

      const filtered = q ? items.filter(i => i.text.toLowerCase().includes(q)) : items.slice(0, 15);

      list.innerHTML = filtered.map(item => `
        <li class="palette-result-item" onclick="loadContent('${item.key}'); closePalette();">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="palette-result-badge">${item.type}</span>
            <span class="palette-result-title">${item.title}</span>
          </div>
          <span class="palette-result-badge">${item.badge}</span>
        </li>
      `).join('');
    }

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openPalette();
      } else if (e.key === 'Escape') {
        closePalette();
      } else if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('sidebarSearch')?.focus();
      }
    });

    function copyText(text, btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          if (btn) {
            const orig = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => { btn.innerText = orig; }, 1800);
          }
        });
      }
    }

    // Initialize Page with Hash Router
    function handleInitialRoute() {
      renderNav();
      const hash = window.location.hash.replace(/^#/, '').trim();
      if (hash && hash !== 'content' && hash !== '') {
        loadContent(hash);
      } else {
        loadContent('overview');
      }
    }

    window.addEventListener('DOMContentLoaded', handleInitialRoute);
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace(/^#/, '').trim();
      if (hash && hash !== 'content' && hash !== '') {
        loadContent(hash);
      }
    });
  </script>
