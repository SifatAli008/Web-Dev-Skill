name: Release & Verification CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Full Master Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Full Master Verification Suite
        run: node tools/verify-all.js

      - name: Run Automated Benchmark Evaluation
        run: node tools/run-evals.js

      - name: Run Multi-Language Golden Reference Project Tests
        run: node tools/run-reference-tests.js

  release:
    name: GitHub Automated Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            evals/benchmark-report.json
            plugin.json
            skills.index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
